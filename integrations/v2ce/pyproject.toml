[project]
name = "event-similarity-v2ce"
version = "0.1.0"
description = "Isolated runtime for generating and converting V2CE event streams"
requires-python = ">=3.11,<3.13"
dependencies = [
    "einops>=0.8.1",
    "h5py>=3.12",
    "numpy>=1.26,<2.0",
    "opencv-python>=4.10",
    "pathlib2>=2.3.7.post1",
    "pyyaml>=6.0.2",
    "torch>=2.7",
    "torchvision>=0.22",
    "tqdm>=4.67",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
